version: 2

updates:
  - package-ecosystem: pip
    directory: /config
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
