name: Deploy

on:
  workflow_dispatch:

jobs:
  demo-run:
    name: Run demo container (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the published image against the sample text
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker run --rm ghcr.io/${{ github.repository }}:latest --sample
