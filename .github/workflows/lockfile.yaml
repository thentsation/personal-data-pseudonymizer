name: Lockfile Update

on:
  schedule:
    - cron: "0 11 * * 1" # segundas 08:00 BRT (UTC-3)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Regenerate lockfile
        run: uv pip compile config/requirements.txt -o config/requirements.lock --universal

      - name: Audit updated lockfile
        id: audit
        run: |
          if uvx pip-audit -r config/requirements.lock; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=vulnerable" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: deps/lockfile-update
          delete-branch: true
          title: 'chore(deps): update lockfile'
          body: |
            Lockfile regenerado automaticamente (`uv pip compile`).

            - Atualiza dependências transitivas pinadas em `config/requirements.lock`
            - O CI (pytest, mypy, ruff, pip-audit, Trivy) valida este PR

            Pip-audit: ${{ steps.audit.outputs.status == 'vulnerable' && '**VULNERABILIDADES ENCONTRADAS** — este PR corrige as listadas no log do job de audit' || 'limpo' }}
          commit-message: 'chore(deps): update lockfile'
          labels: |
            dependencies
            python
